name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build and publish macOS release
    runs-on: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Require macOS signing credentials
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MAC_CERTIFICATE_BASE64" || -z "$MAC_CERTIFICATE_PASSWORD" ]]; then
            echo "Configure MAC_CERTIFICATE_BASE64 and MAC_CERTIFICATE_PASSWORD repository secrets before publishing." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Intel packages
        shell: bash
        run: |
          ulimit -n 8192 || ulimit -n 4096
          echo "Open-file limit: $(ulimit -n)"
          npm run desktop:package -- --mac --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Save Intel packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          output_dir="$GITHUB_WORKSPACE/../pdv-martial-desktop-builds"
          mkdir -p release-assets
          for suffix in ".dmg" ".dmg.blockmap" "-mac.zip" "-mac.zip.blockmap"; do
            source="$output_dir/Placedv Query-$version$suffix"
            target="release-assets/Placedv-Query-$version$suffix"
            if [[ ! -f "$source" ]]; then
              echo "Missing Intel package: $source" >&2
              exit 1
            fi
            cp "$source" "$target"
          done

      - name: Build Apple Silicon packages
        shell: bash
        run: |
          ulimit -n 8192 || ulimit -n 4096
          echo "Open-file limit: $(ulimit -n)"
          npm run desktop:package -- --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Save Apple Silicon packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          output_dir="$GITHUB_WORKSPACE/../pdv-martial-desktop-builds"
          for suffix in "-arm64.dmg" "-arm64.dmg.blockmap" "-arm64-mac.zip" "-arm64-mac.zip.blockmap"; do
            source="$output_dir/Placedv Query-$version$suffix"
            target="release-assets/Placedv-Query-$version$suffix"
            if [[ ! -f "$source" ]]; then
              echo "Missing Apple Silicon package: $source" >&2
              exit 1
            fi
            cp "$source" "$target"
          done

      - name: Generate macOS update manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { readdir, stat, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const dir = 'release-assets';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const names = (await readdir(dir))
            .filter((name) => name.endsWith('.zip') || name.endsWith('.dmg'))
            .sort((a, b) => Number(a.includes('arm64')) - Number(b.includes('arm64')));
          if (!names.includes(`Placedv-Query-${version}-mac.zip`) || !names.includes(`Placedv-Query-${version}-arm64-mac.zip`)) {
            throw new Error('Both Intel and Apple Silicon ZIP packages must be present.');
          }

          const records = [];
          for (const name of names) {
            const path = join(dir, name);
            const hash = createHash('sha512');
            for await (const chunk of createReadStream(path)) hash.update(chunk);
            records.push({ name, sha512: hash.digest('base64'), size: (await stat(path)).size });
          }
          const primaryZip = records.find((file) => file.name.endsWith('-mac.zip') && !file.name.endsWith('-arm64-mac.zip'));
          const manifest = [
            `version: ${version}`,
            'files:',
            ...records.flatMap((file) => [
              `  - url: ${file.name}`,
              `    sha512: ${file.sha512}`,
              `    size: ${file.size}`,
            ]),
            `path: ${primaryZip.name}`,
            `sha512: ${primaryZip.sha512}`,
            `releaseDate: '${new Date().toISOString()}'`,
            '',
          ].join('\n');
          await writeFile(join(dir, 'latest-mac.yml'), manifest);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Placedv Query $version" \
            --generate-notes \
            --target "$GITHUB_SHA"
