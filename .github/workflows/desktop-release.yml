name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Require macOS signing credentials
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$MAC_CERTIFICATE_BASE64" || -z "$MAC_CERTIFICATE_PASSWORD" ]]; then
            echo "Configure MAC_CERTIFICATE_BASE64 and MAC_CERTIFICATE_PASSWORD repository secrets before publishing." >&2
            exit 1
          fi
          if [[ -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "Configure APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER repository secrets before publishing notarized macOS builds." >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 - "$key_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          key_data = base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True)
          if not key_data.startswith(b"-----BEGIN PRIVATE KEY-----"):
              raise SystemExit("APPLE_API_KEY must contain the base64-encoded .p8 private key")
          key_path = pathlib.Path(sys.argv[1])
          key_path.write_bytes(key_data)
          key_path.chmod(0o600)
          PY
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build Intel packages
        shell: bash
        run: |
          ulimit -n 65536 || ulimit -n 16384 || ulimit -n 8192
          echo "Open-file soft limit: $(ulimit -Sn); hard limit: $(ulimit -Hn)"
          npm run desktop:package -- --mac --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Collect Intel packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          output_dir="$GITHUB_WORKSPACE/../pdv-martial-desktop-builds"
          mkdir -p release-assets
          for suffix in ".dmg" ".dmg.blockmap" "-mac.zip" "-mac.zip.blockmap"; do
            source="$output_dir/Placedv Query-$version$suffix"
            target="release-assets/Placedv-Query-$version$suffix"
            if [[ ! -f "$source" ]]; then
              echo "Missing Intel package: $source" >&2
              exit 1
            fi
            cp "$source" "$target"
          done

      - name: Upload Intel packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-packages
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  build-macos-apple-silicon:
    name: Build macOS Apple Silicon
    runs-on: macos-15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Require macOS signing credentials
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$MAC_CERTIFICATE_BASE64" || -z "$MAC_CERTIFICATE_PASSWORD" ]]; then
            echo "Configure MAC_CERTIFICATE_BASE64 and MAC_CERTIFICATE_PASSWORD repository secrets before publishing." >&2
            exit 1
          fi
          if [[ -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "Configure APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER repository secrets before publishing notarized macOS builds." >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 - "$key_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          key_data = base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True)
          if not key_data.startswith(b"-----BEGIN PRIVATE KEY-----"):
              raise SystemExit("APPLE_API_KEY must contain the base64-encoded .p8 private key")
          key_path = pathlib.Path(sys.argv[1])
          key_path.write_bytes(key_data)
          key_path.chmod(0o600)
          PY
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build Apple Silicon packages
        shell: bash
        run: |
          ulimit -n 65536 || ulimit -n 16384 || ulimit -n 8192
          echo "Open-file soft limit: $(ulimit -Sn); hard limit: $(ulimit -Hn)"
          npm run desktop:package -- --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Collect Apple Silicon packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          output_dir="$GITHUB_WORKSPACE/../pdv-martial-desktop-builds"
          mkdir -p release-assets
          shopt -s nullglob
          echo "Apple Silicon build output ($output_dir):"
          ls -lah "$output_dir"

          # electron-builder can omit the architecture segment from the DMG
          # name when only one macOS architecture is packaged. This job builds
          # arm64 on a clean runner, so identify its outputs by type and publish
          # them under stable architecture-specific release names.
          dmg_candidates=("$output_dir"/Placedv\ Query-*-arm64.dmg)
          if (( ${#dmg_candidates[@]} == 0 )); then
            dmg_candidates=("$output_dir"/Placedv\ Query-*.dmg)
          fi
          zip_candidates=("$output_dir"/Placedv\ Query-*-arm64-mac.zip)
          if (( ${#zip_candidates[@]} == 0 )); then
            zip_candidates=("$output_dir"/Placedv\ Query-*-mac.zip)
          fi

          if (( ${#dmg_candidates[@]} != 1 || ${#zip_candidates[@]} != 1 )); then
            echo "Expected one DMG and one ZIP from the arm64 build; found ${#dmg_candidates[@]} DMGs and ${#zip_candidates[@]} ZIPs." >&2
            exit 1
          fi

          dmg="${dmg_candidates[0]}"
          zip="${zip_candidates[0]}"
          cp "$dmg" "release-assets/Placedv-Query-$version-arm64.dmg"
          cp "$dmg.blockmap" "release-assets/Placedv-Query-$version-arm64.dmg.blockmap"
          cp "$zip" "release-assets/Placedv-Query-$version-arm64-mac.zip"
          cp "$zip.blockmap" "release-assets/Placedv-Query-$version-arm64-mac.zip.blockmap"

      - name: Upload Apple Silicon packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon-packages
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run desktop:package -- --linux --x64 --publish never
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Collect Linux packages
        shell: bash
        run: |
          output_dir="$GITHUB_WORKSPACE/../pdv-martial-desktop-builds"
          mkdir -p release-assets
          shopt -s nullglob
          echo "Linux build output ($output_dir):"
          ls -lah "$output_dir"

          appimage_candidates=("$output_dir"/*.AppImage)
          deb_candidates=("$output_dir"/*.deb)
          if (( ${#appimage_candidates[@]} != 1 || ${#deb_candidates[@]} != 1 )); then
            echo "Expected one AppImage and one .deb; found ${#appimage_candidates[@]} AppImages and ${#deb_candidates[@]} .deb packages." >&2
            exit 1
          fi

          cp "${appimage_candidates[0]}" release-assets/
          cp "${deb_candidates[0]}" release-assets/
          for manifest in latest-linux.yml; do
            if [[ -f "$output_dir/$manifest" ]]; then cp "$output_dir/$manifest" release-assets/; fi
          done
          for package in "${appimage_candidates[0]}" "${deb_candidates[0]}"; do
            if [[ -f "$package.blockmap" ]]; then cp "$package.blockmap" release-assets/; fi
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run desktop:package -- --win --x64 --publish never
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Collect Windows packages
        shell: pwsh
        run: |
          $outputDir = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\pdv-martial-desktop-builds'))
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Write-Host "Windows build output ($outputDir):"
          Get-ChildItem -Path $outputDir -File | Format-Table Name, Length

          $installers = @(Get-ChildItem -Path $outputDir -File -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' })
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer; found $($installers.Count)."
          }

          Copy-Item $installers[0].FullName -Destination $releaseDir
          $blockmap = "$($installers[0].FullName).blockmap"
          if (Test-Path $blockmap) { Copy-Item $blockmap -Destination $releaseDir }

          $latestYml = Join-Path $outputDir 'latest.yml'
          if (Test-Path $latestYml) { Copy-Item $latestYml -Destination $releaseDir }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos-intel
      - build-macos-apple-silicon
      - build-linux
      - build-windows
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: "*-packages"
          path: release-assets
          merge-multiple: true

      - name: Generate macOS update manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { readdir, stat, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const dir = 'release-assets';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const names = (await readdir(dir))
            .filter((name) => name.endsWith('.zip') || name.endsWith('.dmg'))
            .sort((a, b) => Number(a.includes('arm64')) - Number(b.includes('arm64')));
          if (!names.includes(`Placedv-Query-${version}-mac.zip`) || !names.includes(`Placedv-Query-${version}-arm64-mac.zip`)) {
            throw new Error('Both Intel and Apple Silicon ZIP packages must be present.');
          }

          const records = [];
          for (const name of names) {
            const path = join(dir, name);
            const hash = createHash('sha512');
            for await (const chunk of createReadStream(path)) hash.update(chunk);
            records.push({ name, sha512: hash.digest('base64'), size: (await stat(path)).size });
          }
          const primaryZip = records.find((file) => file.name.endsWith('-mac.zip') && !file.name.endsWith('-arm64-mac.zip'));
          const manifest = [
            `version: ${version}`,
            'files:',
            ...records.flatMap((file) => [
              `  - url: ${file.name}`,
              `    sha512: ${file.sha512}`,
              `    size: ${file.size}`,
            ]),
            `path: ${primaryZip.name}`,
            `sha512: ${primaryZip.sha512}`,
            `releaseDate: '${new Date().toISOString()}'`,
            '',
          ].join('\n');
          await writeFile(join(dir, 'latest-mac.yml'), manifest);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Placedv Query $version" \
            --generate-notes \
            --target "$GITHUB_SHA"
