appId: com.placedv.query
productName: Placedv Query
asar: false
directories:
  app: .desktop-package
  output: ../pdv-martial-desktop-builds
files:
  - "**/*"
  - from: "node_modules/.prisma"
    to: "node_modules/.prisma"
    filter: ["**/*"]
publish:
  provider: github
  owner: scasolari
  repo: pdv-martial
  releaseType: release
mac:
  icon: assets/icons/placedv-query.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  electronLanguages:
    - en
    - it
  target:
    - dmg
    - zip
win:
  icon: assets/icons/placedv-query.ico
  target: nsis
linux:
  icon: assets/icons/placedv-query.png
  target:
    - AppImage
    - deb
